[workspace]
resolver = "2"
members = [
    "crates/soma-core",
    "crates/soma-doc",
    "crates/soma-engine",
    "crates/soma-metrics",
    "crates/soma-template",
    "crates/soma-rules",
    "crates/soma-layout",
    "crates/soma-md",
    "crates/soma-html",
    "crates/soma-latex",
    "crates/soma-math",
    "crates/soma-collate",
    "crates/soma-hyphen",
    "crates/soma-docx",
    "crates/soma-render-html",
    "crates/soma-render-svg",
    "crates/soma-render-pdf",
    "crates/soma-eval",
    "crates/soma-demo",
    "crates/soma-cli",
    "crates/soma-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["zhanghuanhuan303"]

[profile.release]
lto = "thin"
codegen-units = 1
