# somadoc.art — static Soma Studio (ADR-0121).
# There is no application server and no /api. Only dist/ and /fonts/v2/ are
# served. Keep this file separate from other vhosts on the host.
<VirtualHost *:443>
    ServerName somadoc.art
    ServerAlias www.somadoc.art

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/somadoc.art/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/somadoc.art/privkey.pem
    Protocols h2 http/1.1

    DocumentRoot /opt/somadoc/dist
    DirectoryIndex index.html
    <Directory /opt/somadoc/dist>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None
    </Directory>

    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=31536000"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "no-referrer"
        Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"

        <FilesMatch "\.(js|css|wasm|ttf|otf)$">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </FilesMatch>
        <Files "index.html">
            Header set Cache-Control "no-cache"
        </Files>
        <Files "welcome.md">
            Header set Cache-Control "no-cache"
        </Files>
    </IfModule>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE application/wasm application/javascript text/css text/html text/markdown image/svg+xml
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/somadoc-error.log
    CustomLog ${APACHE_LOG_DIR}/somadoc-access.log combined
</VirtualHost>
